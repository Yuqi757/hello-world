<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三菱PLC指令查询系统</title>
  <script>
    try{var t=localStorage.getItem("plc-theme");var d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",t||(d?"dark":"light"));}catch(e){}
  </script>
  <style>
    :root{--bg:#eef3f9;--card:#fff;--text:#222;--muted:#666;--border:#e5ebf2;--hover:#f8fbff;--accent:#1874b8;--accent-dark:#12598d;--chip-bg:#eaf3fb;--chip-text:#175f97;--code-bg:#101828;--code-text:#d8e5ff;--mark-bg:#ffd54f;--mark-text:#222;--topbar1:#0d3f69;--topbar2:#1874b8;--sidebar-title-bg:#fbfdff;--tree-header-bg:#f7fafd;--tree-header-border:#e4edf6;--tree-hover:#eef6ff;--input-bg:#fff;--input-text:#222;--placeholder:#7a8694;--overlay:rgba(8,15,26,.52);--thead:#f2f7fb;--star:#f5b301;--btn-light-bg:rgba(255,255,255,.14);--danger:#d64545;--flash:rgba(24,116,184,.32)}
    [data-theme="dark"]{--bg:#0d141c;--card:#151f2b;--text:#e8eef7;--muted:#9db0c3;--border:#263444;--hover:#1b2836;--accent:#4da3e8;--accent-dark:#79bdf4;--chip-bg:#173752;--chip-text:#9ed1fb;--code-bg:#09101d;--code-text:#d5e5ff;--mark-bg:#f0b429;--mark-text:#111;--topbar1:#07111c;--topbar2:#10456f;--sidebar-title-bg:#111b26;--tree-header-bg:#172433;--tree-header-border:#283c52;--tree-hover:#1d3046;--input-bg:#0b1420;--input-text:#e8eef7;--placeholder:#7c8fa3;--overlay:rgba(0,0,0,.66);--thead:#132030;--star:#f5b301;--btn-light-bg:rgba(255,255,255,.10);--danger:#ff6b6b;--flash:rgba(77,163,232,.32)}
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth}
    body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button{font-family:inherit}
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--topbar1),var(--topbar2));color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16)}
    .topbar-inner{max-width:1920px;margin:0 auto;padding:12px 16px}
    .topbar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
    .topbar h1{font-size:24px}
    .design-credit{font-size:13px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 14px;border-radius:999px;white-space:nowrap;font-weight:700;letter-spacing:1px}
    .topbar p{font-size:13px;opacity:.92;margin-bottom:10px;line-height:1.5}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .search-box{position:relative;flex:1;min-width:260px;max-width:680px}
    .search-box input{width:100%;height:44px;border:none;outline:none;border-radius:12px;padding:0 42px 0 14px;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.08);background:var(--input-bg);color:var(--input-text)}
    .search-box input::placeholder{color:var(--placeholder)}
    .search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--placeholder);font-size:17px}
    .btn{border:none;outline:none;cursor:pointer;border-radius:12px;padding:0 14px;height:44px;font-size:14px;transition:.2s}
    .btn-reset{background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:600}
    .btn-reset:hover{background:var(--hover)}
    .btn-theme,.btn-ghost{background:var(--btn-light-bg);color:#fff;border:1px solid rgba(255,255,255,.2);font-weight:600}
    .btn-theme:hover,.btn-ghost:hover{background:rgba(255,255,255,.22)}
    .select{height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:var(--btn-light-bg);color:#fff;padding:0 12px;font-size:14px;outline:none;cursor:pointer}
    .select option{color:#222}
    .stats{background:var(--btn-light-bg);padding:10px 13px;border-radius:12px;font-size:13px;white-space:nowrap;color:#fff}
    .layout{max-width:1920px;margin:14px auto;padding:0 16px 60px;display:flex;gap:16px;align-items:flex-start}
    .sidebar{width:320px;flex-shrink:0;background:var(--card);color:var(--text);border-radius:16px;box-shadow:0 6px 22px rgba(15,40,70,.08);overflow:hidden;position:sticky;top:130px;max-height:calc(100vh - 150px);display:flex;flex-direction:column}
    .sidebar-title{padding:14px 16px 10px;font-size:17px;font-weight:700;border-bottom:1px solid var(--border);background:var(--sidebar-title-bg)}
    .tree-wrap{padding:12px;overflow:auto}
    .all-btn{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .all-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .mini-count{background:rgba(255,255,255,.18);color:inherit;border-radius:999px;min-width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 8px}
    .recent-label{font-size:12px;color:var(--muted);margin:4px 0 6px;font-weight:700}
    .recent-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .recent-item{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--tree-header-bg);color:var(--accent);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;cursor:pointer;font-family:Consolas,monospace;font-weight:700}
    .recent-item:hover{background:var(--tree-hover)}
    .recent-cmd{line-height:1}
    .recent-del{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.15);color:inherit;font-size:12px;cursor:pointer;line-height:1;flex-shrink:0}
    .recent-del:hover{background:var(--danger);color:#fff}
    .tree-cat{margin-bottom:8px}
    .tree-cat-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer;user-select:none;font-weight:700;color:var(--text);background:var(--tree-header-bg);border:1px solid var(--tree-header-border)}
    .tree-cat-header:hover{background:var(--tree-hover)}
    .tree-cat-header.active{background:var(--chip-bg);color:var(--accent);border-color:var(--accent)}
    .arrow{font-size:12px;transition:.18s;transform:rotate(0deg)}
    .tree-cat.closed .arrow{transform:rotate(-90deg)}
    .count{margin-left:auto;background:var(--accent);color:#fff;min-width:26px;height:24px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
    .tree-items{display:grid;gap:5px;padding:9px 0 4px 18px}
    .tree-cat.closed .tree-items{display:none}
    .tree-item{width:100%;border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text);font-size:14px;line-height:1.5;display:flex;align-items:center;gap:6px}
    .tree-item:hover{background:var(--tree-hover)}
    .tree-item .cmd{font-family:Consolas,monospace;font-weight:700;color:var(--accent)}
    .tree-badges{margin-left:auto;font-size:13px;white-space:nowrap}
    .tree-open{margin-left:6px;cursor:pointer;opacity:.75;font-size:15px;flex-shrink:0}
    .tree-open:hover{opacity:1;transform:scale(1.12)}
    .content{flex:1;min-width:0}
    .print-title{display:none}
    .table-card{background:var(--card);color:var(--text);border-radius:16px;overflow:hidden;box-shadow:0 6px 22px rgba(15,40,70,.08);scroll-margin-top:150px}
    .table-wrap{overflow:auto;max-height:calc(100vh - 200px)}
    table{width:100%;border-collapse:collapse;min-width:1250px}
    thead{background:var(--thead)}
    thead th{position:sticky;top:0;z-index:5;background:var(--thead);box-shadow:0 1px 0 var(--border)}
    th,td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:top;font-size:15px;line-height:1.6}
    th{color:var(--text);text-align:left;font-weight:700;white-space:nowrap}
    tbody tr{cursor:pointer;scroll-margin-top:60px}
    tbody tr:hover{background:var(--hover)}
    tbody tr.row-flash{animation:rowFlash 2.2s ease}
    @keyframes rowFlash{0%{background:var(--flash)}65%{background:var(--flash)}100%{background:transparent}}
    .fav-cell{width:58px;text-align:center}
    .fav-btn{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#b8c4d2;padding:2px 6px;border-radius:8px}
    .fav-btn:hover{background:var(--hover);color:var(--star)}
    .fav-btn.active{color:var(--star)}
    .cmd{font-family:Consolas,monospace;font-weight:700;color:var(--accent);white-space:nowrap;font-size:16px}
    .badge{font-size:13px;margin-left:5px}
    .name{font-weight:600;white-space:nowrap}
    .cat{display:inline-block;background:var(--chip-bg);color:var(--chip-text);padding:4px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
    .models{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
    .desc{min-width:240px}
    .note{margin-top:6px;color:var(--muted);font-size:13px}
    .code{font-family:Consolas,monospace;background:var(--code-bg);color:var(--code-text);padding:10px 12px;border-radius:10px;white-space:pre;overflow-x:auto;min-width:210px;font-size:13.5px;line-height:1.55}
    mark{background:var(--mark-bg);color:var(--mark-text);padding:0 2px;border-radius:3px}
    .empty{text-align:center;color:var(--muted);padding:20px 10px}
    .footer-note{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}
    .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
    .modal{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
    .modal-header{padding:20px 22px;background:linear-gradient(135deg,var(--topbar1),var(--topbar2));color:#fff;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:sticky;top:0;z-index:2}
    .modal-title{font-size:28px;font-weight:800;font-family:Consolas,monospace;margin-bottom:6px;word-break:break-all}
    .modal-sub{font-size:14px;opacity:.92}
    .modal-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
    .modal-fav-btn{border:none;min-width:100px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font-size:14px;font-weight:700}
    .modal-fav-btn.active{background:var(--star);color:#222}
    .modal-close{border:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
    .modal-close:hover,.modal-fav-btn:hover{filter:brightness(1.08)}
    .modal-body{padding:22px}
    .meta-grid{display:grid;grid-template-columns:110px 1fr;gap:12px 16px;margin-bottom:10px}
    .meta-label{font-weight:700;color:var(--accent)}
    .copy-btn,.small-btn{border:none;outline:none;background:var(--accent);color:#fff;border-radius:12px;cursor:pointer;font-size:14px}
    .copy-btn{margin-top:12px;padding:11px 16px}
    .small-btn{height:38px;padding:0 14px}
    .copy-btn:hover,.small-btn:hover{background:var(--accent-dark)}
    .small-btn:disabled{opacity:.55;cursor:not-allowed}
    .section-title{margin:20px 0 10px;font-size:16px;font-weight:800;color:var(--accent);border-left:4px solid var(--accent);padding-left:10px}
    textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card);color:var(--text);outline:none;line-height:1.7;font-size:14px}
    textarea:focus{border-color:var(--accent)}
    .note-actions{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:12px;line-height:1.6}
    .img-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .img-item{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--code-bg)}
    .img-item img{width:100%;height:100px;object-fit:cover;display:block;cursor:zoom-in}
    .img-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.58);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
    .img-del:hover{background:var(--danger)}
    .related-wrap{display:flex;flex-wrap:wrap;gap:8px}
    .related-chip{border:1px solid var(--border);background:var(--tree-header-bg);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .related-chip:hover{background:var(--tree-hover);border-color:var(--accent)}
    .related-chip .cmd{font-size:13px}
    .img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:2000;padding:30px}
    .img-viewer img{max-width:95vw;max-height:90vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .img-viewer-close{position:fixed;top:18px;right:18px;width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer;z-index:2001}
    .img-viewer-close:hover{background:rgba(255,255,255,.28)}
    .back-top{position:fixed;right:24px;bottom:28px;width:50px;height:50px;border:none;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:900;opacity:.94;transition:.2s}
    .back-top:hover{background:var(--accent-dark);transform:translateY(-2px)}
    @media (max-width:1100px){.layout{flex-direction:column}.sidebar{width:100%;position:static;max-height:none}.tree-wrap{max-height:420px}.table-wrap{max-height:none}}
    @media (max-width:768px){.topbar h1{font-size:20px}.toolbar{flex-direction:column;align-items:stretch}.search-box{max-width:100%}.btn-reset,.btn-theme,.btn-ghost,.stats,.select{width:100%;text-align:center}.meta-grid{grid-template-columns:1fr;gap:4px 0}.meta-label{margin-top:10px}.modal-actions{flex-direction:column}.back-top{right:16px;bottom:18px;width:44px;height:44px}}
    @media print{
      .topbar,.sidebar,.back-top,.footer-note,.img-viewer,.modal-overlay{display:none!important}
      .print-title{display:block!important;font-size:22px;font-weight:800;margin:0 0 14px;color:#000}
      body{background:#fff}
      .layout{display:block;max-width:none;margin:0;padding:0}
      .content{width:100%}
      .table-card{box-shadow:none;border-radius:0}
      .table-wrap{max-height:none;overflow:visible}
      table{min-width:0;width:100%}
      thead th{position:static;background:#eee!important;color:#000;box-shadow:none}
      th,td{color:#000;border-bottom:1px solid #ccc;font-size:11px;padding:6px}
      .code{background:#f5f5f5;color:#000;white-space:pre-wrap;min-width:0}
      .cat{background:#eee;color:#000}
      .models{color:#555}
      .desc{min-width:0}
      mark{background:none;color:#000}
      th:first-child,td.fav-cell{display:none!important}
      .badge{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-head">
        <h1>三菱PLC指令查询系统</h1>
        <div class="design-credit">本系统由王总设计</div>
      </div>
      <p>快捷键：/ 聚焦搜索，Esc 关闭弹窗。支持中文/拼音搜索、机型筛选、打印、备份。共收录 166 条指令。</p>
      <div class="toolbar">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="支持中文/拼音，如：定时器 或 dingshiqi 或 dsq" autocomplete="off" />
          <span class="search-icon">🔍</span>
        </div>
        <select id="modelFilter" class="select"></select>
        <button id="themeBtn" class="btn btn-theme">🌙 暗色</button>
        <button id="resetBtn" class="btn btn-reset">重置</button>
        <button id="printBtn" class="btn btn-ghost">打印手册</button>
        <button id="exportBtn" class="btn btn-ghost">导出备份</button>
        <button id="importBtn" class="btn btn-ghost">导入备份</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
        <div id="stats" class="stats">共 0 条指令</div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">指令目录树</div>
      <div class="tree-wrap" id="tree"></div>
    </aside>

    <main class="content" id="content">
      <div class="print-title">三菱PLC指令手册</div>
      <div class="table-card" id="tableCard">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>收藏</th><th>指令</th><th>名称</th><th>分类</th><th>中文说明</th><th>示例程序</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="footer-note">点击目录项定位，点 📖 查看详情与相关指令；机型与拼音仅供参考；数据存本机，请定期导出备份。</div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="指令详情">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <div class="modal-actions">
          <button id="modalFavBtn" class="modal-fav-btn">☆ 收藏</button>
          <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="img-viewer" id="imgViewer" hidden>
    <button id="imgViewerClose" class="img-viewer-close" aria-label="关闭图片">✕</button>
    <img id="imgViewerImg" alt="图片预览" />
  </div>

  <button id="backTopBtn" class="back-top" hidden title="回到顶部">↑</button>
  <script>
    const SERIES=[
      {code:"1N",name:"FX1N"},{code:"2N",name:"FX2N"},{code:"3G",name:"FX3G"},{code:"3U",name:"FX3U"},{code:"5U",name:"FX5U"}
    ];
    const CODE2NAME={};SERIES.forEach(function(s){CODE2NAME[s.code]=s.name;});
    function parseModels(s){if(!s||s==="ALL")return SERIES.map(x=>x.code);var o=[];for(var i=0;i<s.length;i+=2)o.push(s.slice(i,i+2));return o;}

    const RAW=[
      ["LD","取指令","基本逻辑","从母线读取常开触点，逻辑行开始。","X0为ON时导通。","LD X0\nOUT Y0","ALL"],
      ["LDI","取反指令","基本逻辑","从母线读取常闭触点。","X0为OFF时导通。","LDI X0\nOUT Y0","ALL"],
      ["AND","与指令","基本逻辑","串联常开触点。","X0、X1均ON时输出。","LD X0\nAND X1\nOUT Y0","ALL"],
      ["ANI","与非指令","基本逻辑","串联常闭触点。","X0为ON且X1为OFF时输出。","LD X0\nANI X1\nOUT Y0","ALL"],
      ["OR","或指令","基本逻辑","并联常开触点，可自锁。","常用于自锁。","LD X0\nOR Y0\nOUT Y0","ALL"],
      ["ORI","或非指令","基本逻辑","并联常闭触点。","任一条件满足即导通。","LD X0\nORI M0\nOUT Y0","ALL"],
      ["OUT","输出指令","基本逻辑","驱动线圈，可输出Y、M、S、T、C。","导通时Y0输出。","LD X0\nOUT Y0","ALL"],
      ["SET","置位指令","基本逻辑","置位并保持。","触发后Y0保持ON。","LD X0\nSET Y0","ALL"],
      ["RST","复位指令","基本逻辑","复位元件或清除当前值。","触发后Y0复位。","LD X1\nRST Y0","ALL"],
      ["LDP","上升沿触点","基本逻辑","取上升沿脉冲触点。","上升沿导通一拍。","LDP X0\nOUT Y0","ALL"],
      ["LDF","下降沿触点","基本逻辑","取下降沿脉冲触点。","下降沿导通一拍。","LDF X0\nOUT Y0","ALL"],

    function openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};r.onsuccess=e=>{idb=e.target.result;res();};r.onerror=()=>rej(r.error);});}

    function idbSet(id,arr){return new Promise((res,rej)=>{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(arr,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

    function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
    function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
    function updateTokens(){tokens=keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);}
    function getHighlightRegex(){if(!tokens.length)return null;return new RegExp("(?:"+tokens.map(escapeRegExp).join("|")+")","gi");}
    function highlight(text){const raw=String(text??"");if(!tokens.length)return escapeHtml(raw);const re=getHighlightRegex();if(!re)return escapeHtml(raw);let res="",last=0;for(const m of raw.matchAll(re)){res+=escapeHtml(raw.slice(last,m.index))+"<mark>"+escapeHtml(m[0])+"</mark>";last=m.index+m[0].length;}res+=escapeHtml(raw.slice(last));return res;}
    function modelLabel(item){return(item.models||[]).map(c=>CODE2NAME[c]||c).join(" / ");}
    function matchTokens(item){if(!tokens.length)return true;const hay=[item.cmd,item.name,item.cat,item.desc,item.note,item.example,item.myNote||"",item._py||""].join(" ").toLowerCase();return tokens.every(t=>hay.includes(t));}
    function matchesView(item){if(activeCat==="收藏"&&!favorites.has(item.id))return false;if(activeCat!=="全部"&&activeCat!=="收藏"&&item.cat!==activeCat)return false;if(activeModel!=="all"&&!(item.models||[]).includes(activeModel))return false;return true;}

    function getTreeGroups(){const g=new Map();getDataWithId().forEach(i=>{if(!matchesView(i)||!matchTokens(i))return;if(!g.has(i.cat))g.set(i.cat,{cat:i.cat,items:[]});g.get(i.cat).items.push(i);});return[...g.values()];}

    function renderTree(){

      if(saveNotes()){if(st&&!silent)st.textContent=manual?"已保存。":"已自动保存。";renderAll();}else{if(st&&!silent)st.textContent="保存失败。";}}
    async function copyText(text,btn){const orig=btn.textContent;try{await navigator.clipboard.writeText(text);btn.textContent="已复制";setTimeout(()=>btn.textContent=orig,1500);}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");btn.textContent="已复制";setTimeout(()=>btn.textContent=orig,1500);}catch(err){alert("复制失败");}document.body.removeChild(ta);}}
    function compressImage(file){return new Promise((res,rej)=>{if(!file.type.startsWith("image/")){rej(new Error("不是图片"));return;}const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.78));};img.onerror=()=>rej(new Error("图片读取失败"));img.src=rd.result;};rd.onerror=()=>rej(new Error("文件读取失败"));rd.readAsDataURL(file);});}
    async function handleImageUpload(files){if(currentModalId===null||!files||!files.length)return;const id=currentModalId,current=images[id]||[];const remaining=MAX_IMAGES-current.length;if(remaining<=0){alert(`每个指令最多 ${MAX_IMAGES} 张图片。`);return;}
      const list=Array.from(files).slice(0,remaining);if(files.length>remaining)alert(`最多 ${MAX_IMAGES} 张，本次只处理前 ${remaining} 张。`);const old=current.slice();
      try{for(const f of list){const d=await compressImage(f);current.push(d);}images[id]=current;await persistImages(id);renderImageSection();renderAll();}catch(e){images[id]=old;renderImageSection();alert("图片处理失败");}}
    async function deleteImage(index){if(currentModalId===null)return;const id=currentModalId,current=images[id]||[];if(index<0||index>=current.length)return;if(!confirm("确定删除这张图片吗？"))return;const old=current.slice();const next=old.filter((_,i)=>i!==index);
      if(next.length)images[id]=next;else delete images[id];try{if(next.length)await persistImages(id);else await removeImagesPersist(id);}catch(e){images[id]=old;}renderImageSection();renderAll();}
    function openImageViewer(i){if(currentModalId===null)return;const src=(images[currentModalId]||[])[i];if(!src)return;imgViewerImg.src=src;imgViewer.hidden=false;}
    function closeImageViewer(){imgViewer.hidden=true;imgViewerImg.src="";}
    function toggleBackTopButton(){backTopBtn.hidden=window.scrollY<300;}
    function exportBackup(){const data={app:"mitsubishi-plc",version:3,exportedAt:new Date().toISOString(),theme:currentTheme(),favorites:[...favorites],notes:notes,images:images,recent:recent};
      const blob=new Blob([JSON.stringify(data)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="plc-backup-"+Date.now()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function importBackup(file){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(!confirm("导入将覆盖当前收藏、笔记和图片，是否继续？"))return;
      favorites=new Set((d.favorites||[]).map(String));notes=d.notes||{};images=d.images||{};recent=Array.isArray(d.recent)?d.recent:recent;saveFavorites();saveNotes();saveRecent();
      if(useIDB){for(const k in images){await idbSet(k,images[k]);}}else{try{localStorage.setItem(IMAGES_KEY,JSON.stringify(images));}catch(e){}}
      if(d.theme)applyTheme(d.theme);renderAll();alert("导入成功");}catch(e){alert("导入失败：文件格式不正确。");}};fr.readAsText(file);}

    modelFilter.innerHTML='<option value="all">全部机型</option>'+SERIES.map(s=>`<option value="${s.code}">${s.name}</option>`).join("");
    modelFilter.addEventListener("change",()=>{activeModel=modelFilter.value;renderAll();});
    searchInput.addEventListener("input",e=>{keyword=e.target.value;updateTokens();renderAll();});
    resetBtn.addEventListener("click",()=>{searchInput.value="";keyword="";activeCat="全部";activeModel="all";modelFilter.value="all";updateTokens();expanded.clear();cats.filter(c=>c!=="全部"&&c!=="收藏").forEach(c=>expanded.add(c));renderAll();window.scrollTo({top:0,behavior:"smooth"});});
    themeBtn.addEventListener("click",()=>applyTheme(currentTheme()==="dark"?"light":"dark"));
    printBtn.addEventListener("click",()=>window.print());
    exportBtn.addEventListener("click",exportBackup);
    importBtn.addEventListener("click",()=>importFile.click());
    importFile.addEventListener("change",e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value="";});
    backTopBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
    window.addEventListener("scroll",toggleBackTopButton,{passive:true});
    tree.addEventListener("click",e=>{
      const recentDel=e.target.closest(".recent-del");if(recentDel){removeRecent(recentDel.dataset.recentDel);return;}
      const recentItem=e.target.closest(".recent-item");if(recentItem){openModal(recentItem.dataset.recentId);return;}
      const allBtn=e.target.closest(".all-btn");if(allBtn){activeCat=allBtn.dataset.cat;renderAll();scrollToFirstRow();return;}
      const header=e.target.closest(".tree-cat-header");if(header){const cat=header.dataset.cat;if(expanded.has(cat))expanded.delete(cat);else expanded.add(cat);activeCat=cat;renderAll();scrollToFirstRow();return;}
      const openDetail=e.target.closest(".tree-open");if(openDetail){openModal(openDetail.dataset.openId);return;}
      const itemBtn=e.target.closest(".tree-item");if(itemBtn)scrollToCommand(itemBtn.dataset.id);});
    tbody.addEventListener("click",e=>{const favBtn=e.target.closest(".fav-btn");if(favBtn){e.stopPropagation();toggleFavorite(favBtn.dataset.favId);return;}const row=e.target.closest("tr[data-id]");if(row)openModal(row.dataset.id);});
    modalFavBtn.addEventListener("click",()=>{if(currentModalId!==null)toggleFavorite(currentModalId);});
    modalClose.addEventListener("click",closeModal);
    modalOverlay.addEventListener("click",e=>{if(e.target===modalOverlay)closeModal();});
    modalBody.addEventListener("input",e=>{if(e.target&&e.target.id==="noteArea"){const st=$("noteStatus");if(st)st.textContent="正在输入...";clearTimeout(noteTimer);noteTimer=setTimeout(()=>saveCurrentNote(false),700);}});
    modalBody.addEventListener("click",e=>{
      const relatedChip=e.target.closest(".related-chip");if(relatedChip){openModal(relatedChip.dataset.relatedId);return;}
      const copyBtn=e.target.closest(".copy-btn");if(copyBtn){const item=plcData.find(x=>x.id===copyBtn.dataset.id);if(item)copyText(item.example,copyBtn);return;}
      const saveNoteBtn=e.target.closest("#saveNoteBtn");if(saveNoteBtn){saveCurrentNote(true);return;}
      const uploadBtn=e.target.closest("#uploadImgBtn");if(uploadBtn){const fi=$("imgInput");if(fi)fi.click();return;}
      const delBtn=e.target.closest(".img-del");if(delBtn){deleteImage(Number(delBtn.dataset.delIndex));return;}
      const img=e.target.closest("#imgGrid img[data-view-index]");if(img)openImageViewer(Number(img.dataset.viewIndex));});
    modalBody.addEventListener("change",e=>{if(e.target&&e.target.id==="imgInput"){const files=Array.from(e.target.files||[]);e.target.value="";if(files.length)handleImageUpload(files);}});
    imgViewerClose.addEventListener("click",closeImageViewer);
    imgViewer.addEventListener("click",e=>{if(e.target===imgViewer)closeImageViewer();});
    document.addEventListener("keydown",e=>{
      if(e.key==="Escape"){if(!imgViewer.hidden){closeImageViewer();return;}if(!modalOverlay.hidden)closeModal();return;}
      if(e.key==="/"){const ae=document.activeElement;const tag=ae?ae.tagName:"";if(tag!=="INPUT"&&tag!=="TEXTAREA"){e.preventDefault();searchInput.focus();}}});

    buildPinyin();applyTheme(currentTheme());updateTokens();initStorage();toggleBackTopButton();
  </script>
</body>
</html>
